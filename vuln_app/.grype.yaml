  # busybox / busybox-binsh / ssl_client (Alpine apk packages) -- same
  # situation: no fixed apk build published yet for this CVE on this
  # Alpine release.
  - vulnerability: CVE-2025-60876
    package:
      name: busybox
  - vulnerability: CVE-2025-60876
    package:
      name: busybox-binsh
  - vulnerability: CVE-2025-60876
    package:
      name: ssl_client

  # Embedded CPython 3.12.16 interpreter -- Grype's "fixed in" versions for
  # these are all 3.13.x/3.14.x/3.15.x, or in several cases only a
  # pre-release (3.15.0aN/bN, 3.16.0aN) with no stable release at all.
  # Taking the app to a new Python major/minor version is a separate,
  # riskier migration on top of the one already done in this project
  # (python:alpine3.8 -> python:3.12-alpine), for Medium/Low/Negligible
  # findings -- treated as accepted risk for this pass rather than chased
  # into a version bump with no stable target.
