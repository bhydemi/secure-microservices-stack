# Documented, accepted-risk exceptions for vulnerabilities with no real fix
# available yet -- see submissions/grype_remediation_notes.txt for the full
# package-by-package justification. This is the standard way to manage
# genuinely-unfixable findings in a vulnerability scanner: suppress them
# explicitly and in the open, rather than leave them unexplained in every
# scan's output, or pretend they don't exist.
#
# Every rule below is one specific CVE against one specific package, not a
# blanket suppression -- a new, different finding on any of these packages
# (or a future scan once an upstream fix ships) will still surface normally.
ignore:
  # sqlite-libs (Alpine apk package) -- Grype reports these with fix state
  # "unknown" or no fix state at all: no patched sqlite-libs build has been
  # published to this Alpine release's repo yet.
  - vulnerability: CVE-2026-119586
    package:
      name: sqlite-libs
  - vulnerability: CVE-2026-119379
    package:
      name: sqlite-libs
  - vulnerability: CVE-2026-119374
    package:
      name: sqlite-libs
  - vulnerability: CVE-2026-119378
    package:
      name: sqlite-libs
