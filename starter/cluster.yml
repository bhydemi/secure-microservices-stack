# author: nick.reva@snap.com
# created April 11, 2021
nodes:
# Apple Silicon has no VirtualBox support at all, so starter/Vagrantfile's
# VirtualBox provider can't run on this machine. This node is instead a Lima
# VM (native Apple Virtualization framework, same openSUSE Leap 15.6
# aarch64 the Vagrantfile targeted) -- see starter/setup_lima_node.sh for
# how it was brought up. Lima's SSH port is dynamic per-instance; re-check
# it with `limactl list rke-node1` if this node is ever recreated.
#
# address/port are where the `rke` CLI on the Mac reaches the node over SSH
# (Lima's forwarded loopback port). internal_address is what RKE hands to
# the apiserver as --advertise-address and to kubelet/kube-proxy for
# in-cluster traffic -- it has to be the VM's real interface IP (`ip -4 -o
# addr show` inside the VM), not 127.0.0.1: the apiserver silently drops
# loopback addresses when building the default/kubernetes Endpoints object,
# which leaves kube-proxy with no backend to route Service traffic to and
# breaks the canal/CNI deploy job (it reaches the apiserver through that
# same Service IP).
- address: 127.0.0.1
  port: "52093"
  internal_address: 192.168.5.15
  role:
  - controlplane
  - etcd
  - worker
  hostname_override: node1
  user: abdulhakeemoyaqoob
  docker_socket: /var/run/docker.sock
  ssh_key: ""
  ssh_key_path: /Users/abdulhakeemoyaqoob/.lima/_config/user
  ssh_cert: ""
  ssh_cert_path: ""
  labels: {}
  taints: []
#- address: 192.168.50.102
#  port: "22"
#  internal_address: 192.168.50.102
#  role:
#  - worker
#  hostname_override: node2
#  user: root
#  docker_socket: /var/run/docker.sock
#  ssh_key: ""
#  ssh_key_path: ~/.ssh/id_rsa
#  ssh_cert: ""
