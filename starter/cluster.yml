#  taints: []
services:
  etcd:
    image: ""
    extra_args: {}
    extra_binds: []
    extra_env: []
    win_extra_args: {}
    win_extra_binds: []
    win_extra_env: []
    external_urls: []
    ca_cert: ""
    cert: ""
    key: ""
    path: ""
    # Run etcd as a dedicated non-root uid/gid rather than root (0:0) --
    # this is what the CIS Kubernetes Benchmark 1.1.12 "etcd data directory
    # ownership" check (and kube-bench's corresponding control) verifies.
    uid: 52034
    gid: 52034
    snapshot: null
    retention: ""
    creation: ""
    backup_config: null
  kube-api:
    image: ""
    extra_args: {}
    extra_binds: []
    extra_env: []
    win_extra_args: {}
    win_extra_binds: []
    win_extra_env: []
    service_cluster_ip_range: 10.43.0.0/16
    service_node_port_range: ""
    # Enforce the restricted PodSecurityPolicy defined in addons below.
    pod_security_policy: true
    always_pull_images: false
    # Encrypt Secrets at rest in etcd instead of storing them as plain base64.
    secrets_encryption_config:
      enabled: true
      custom_config: null
    # Keep an audit trail of every request the apiserver handles.
    audit_log:
      enabled: true
      configuration: null
    admission_configuration: null
    # Protect the apiserver from being overwhelmed by a burst of requests.
    # The EventRateLimit admission plugin needs its own Configuration object
    # here -- "enabled: true" alone doesn't carry defaults in this RKE
    # version. Limits match the Rancher CIS hardening guide's example.
    event_rate_limit:
      enabled: true
      configuration:
        apiVersion: eventratelimit.admission.k8s.io/v1alpha1
        kind: Configuration
        limits:
          - type: Server
            qps: 5000
            burst: 20000
  kube-controller:
    image: ""
    extra_args:
      feature-gates: RotateKubeletServerCertificate=true
    extra_binds: []
    extra_env: []
    win_extra_args: {}
    win_extra_binds: []
    win_extra_env: []
    cluster_cidr: 10.42.0.0/16
    service_cluster_ip_range: 10.43.0.0/16
  scheduler:
    image: ""
    extra_args: {}
    extra_binds: []
    extra_env: []
    win_extra_args: {}
    win_extra_binds: []
    win_extra_env: []
  kubelet:
    image: ""
    extra_args:
      feature-gates: RotateKubeletServerCertificate=true
      # Stop a pod from overriding hardened sysctl/kernel defaults on the node.
      protect-kernel-defaults: "true"
      # Restrict the kubelet's TLS server to modern, strong cipher suites.
      tls-cipher-suites: TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305,TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305,TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384,TLS_RSA_WITH_AES_256_GCM_SHA384,TLS_RSA_WITH_AES_128_GCM_SHA256
    extra_binds: []
    extra_env: []
    win_extra_args: {}
    win_extra_binds: []
    win_extra_env: []
    cluster_domain: cluster.local
    infra_container_image: ""
    cluster_dns_server: 10.43.0.10
    fail_swap_on: false
    # Issue the kubelet its own serving certificate instead of a self-signed one.
    generate_serving_certificate: true
  kubeproxy:
    image: ""
    extra_args: {}
    extra_binds: []
    extra_env: []
    win_extra_args: {}
    win_extra_binds: []
    win_extra_env: []
network:
  # RKE 1.8.14's bundled canal/calico addon manifests use CRD schemas with
  # CEL x-kubernetes-validations rules, which need Kubernetes 1.25+ to even
  # validate -- this cluster pins Kubernetes 1.20.4 (system_images below)
  # to keep the PodSecurityPolicy-based hardening in the addons block,
  # since PSP was removed outright in 1.25. flannel needs no CRDs at all,
  # sidestepping that version skew, and its images are already pinned
  # above (flannel/flannel_cni).
  plugin: flannel
  options: {}
  mtu: 0
  node_selector: {}
  update_strategy: null
  tolerations: []
authentication:
  strategy: x509
  sans: []
  webhook: null
# Baseline hardening addons: a restricted PodSecurityPolicy (no privileged
# containers, no privilege escalation, must run as non-root), a NetworkPolicy
# object so the CNI plugin enforces one (left permissive here to avoid
# breaking inter-service connectivity for this project; tightening it to
# deny-by-default is a good stand-out improvement), and disabling
# auto-mounted ServiceAccount tokens for the "default" ServiceAccount so a
# compromised pod that never asked for API access doesn't get a token handed
# to it for free.
addons: |
  apiVersion: policy/v1beta1
  kind: PodSecurityPolicy
  metadata:
    name: restricted
  spec:
    requiredDropCapabilities:
    - NET_RAW
    privileged: false
    allowPrivilegeEscalation: false
    defaultAllowPrivilegeEscalation: false
    fsGroup:
      rule: RunAsAny
    runAsUser:
      rule: MustRunAsNonRoot
    seLinux:
      rule: RunAsAny
    supplementalGroups:
      rule: RunAsAny
    volumes:
    - emptyDir
    - secret
    - persistentVolumeClaim
    - downwardAPI
    - configMap
    - projected
  ---
  apiVersion: networking.k8s.io/v1
  kind: NetworkPolicy
  metadata:
    name: default-allow-all
  spec:
    podSelector: {}
    ingress:
    - {}
    egress:
    - {}
    policyTypes:
    - Ingress
    - Egress
  ---
  apiVersion: v1
  kind: ServiceAccount
  metadata:
    name: default
  automountServiceAccountToken: false
addons_include: []
