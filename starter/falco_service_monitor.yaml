apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    # Must match the Helm release name used for kube-prometheus-stack --
    # that's the label its Prometheus CR's serviceMonitorSelector looks
    # for. See starter/setup_falco_grafana.sh, which installs it as
    # release name "kube-prometheus-stack".
    release: kube-prometheus-stack
  name: falco-exporter-servicemonitor
  namespace: falco
spec:
  endpoints:
    # These three keys belong on a single endpoint object, not three
    # separate one-key endpoints (the original list here was invalid --
    # each ServiceMonitor endpoint needs "port" at minimum). No
    # bearerTokenFile: falco-exporter's own /metrics endpoint is plain
    # HTTP with no auth in this chart version.
    - port: metrics
      interval: 5s
  namespaceSelector:
    matchNames:
      - falco
  selector:
    # Targets the falco-exporter Service (release name "falco-exporter",
    # installed via starter/setup_falco_grafana.sh).
    matchLabels:
      app.kubernetes.io/instance: falco-exporter
      app.kubernetes.io/name: falco-exporter
